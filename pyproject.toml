[project]
name = "european-beer-trade"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Susanna Perotti", email = "susanpero00@gmai.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "pandas>=3.1.0",
    "requests>=2.34.2",
]

[project.scripts]
european-beer-trade = "european_beer_trade:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
